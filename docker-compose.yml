services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shinobi
      POSTGRES_PASSWORD: shinobi
      POSTGRES_DB: shinobi_campaign
    ports:
      - "5433:5432"
    volumes:
      - shinobi_pgdata:/var/lib/postgresql/data

volumes:
  shinobi_pgdata:
